<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Like Me?</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Pacifico&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    text-align: center;
}

/* Floating hearts */
.bg-heart {
    position: absolute;
    color: rgba(255,255,255,0.5);
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.container {
    background: rgba(255,255,255,0.9);
    padding: 2rem;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    font-family: 'Pacifico', cursive;
    color: #ff4757;
    margin-bottom: 25px;
}

button {
    padding: 12px 24px;
    margin: 10px;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

#yes-btn {
    background: #2ed573;
    color: white;
}

#no-btn {
    background: #ff6b81;
    color: white;
}

.success {
    display: none;
    flex-direction: column;
    align-items: center;
}

.success h2 {
    font-family: 'Pacifico';
    color: #ff4757;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="hearts"></div>

<div class="container" id="main-box">
    <h1 id="question">Do you like me Nancy?</h1>
    <button id="yes-btn" onclick="yesClick()">Yes 😍</button>
    <button id="no-btn" onclick="noClick()">No 🙄</button>
</div>

<div class="container success" id="success-box">
    <h2>I knew it! ❤️</h2>
    <p style="margin-top:10px;">You are in love with me Nancy 😘</p>
</div>

<script>
let count = 0;

const messages = [
    "No",
    "Are you sure Nancy?",
    "Think again 😏",
    "I know you like me...",
    "Stop lying 😌",
    "Come on Nancy 💕",
    "Just accept it already!",
    "You can't escape 😆",
    "Say YES now!",
    "Last chance 😤"
];

function noClick() {
    count++;

    document.getElementById("question").innerText =
        messages[Math.min(count, messages.length - 1)];

    // grow yes button
    let yes = document.getElementById("yes-btn");
    yes.style.transform = `scale(${1 + count * 0.3})`;

    // shrink no button
    let no = document.getElementById("no-btn");
    no.style.transform = `scale(${1 - count * 0.1})`;

    if (count > 6) no.style.display = "none";
}

function yesClick() {
    document.getElementById("main-box").style.display = "none";
    document.getElementById("success-box").style.display = "flex";
}

/* floating hearts */
function createHearts() {
    const container = document.getElementById("hearts");
    for (let i = 0; i < 15; i++) {
        let heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.classList.add("bg-heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
        container.appendChild(heart);
    }
}
createHearts();
</script>

</body>
</html>
